name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
        Привет, @${{ github.actor }}! Спасибо за твой первый Issue! Мы скоро его рассмотрим.
        pr-message: |
        Отличная работа, @${{ github.actor }}! Спасибо за первый Pull Request!
